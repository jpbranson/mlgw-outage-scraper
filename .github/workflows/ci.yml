name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dashboard:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  historical-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verification.txt
      - run: python -B -m unittest discover -s test -p 'legacy*_test.py'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Validate R verifier syntax (full evidence replay is a separate restore check)
        run: Rscript --vanilla -e 'for (f in list.files("scripts", pattern="[.]R$", full.names=TRUE)) parse(file=f)'
